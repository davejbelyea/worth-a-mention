# Every push to main tells Cloudways to pull the latest code, so the live site updates on its own.
# Needs four repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDWAYS_EMAIL, CLOUDWAYS_API_KEY, CLOUDWAYS_SERVER_ID, CLOUDWAYS_APP_ID
name: Deploy to Cloudways

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Cloudways to pull the latest code
        env:
          EMAIL: ${{ secrets.CLOUDWAYS_EMAIL }}
          API_KEY: ${{ secrets.CLOUDWAYS_API_KEY }}
          SERVER_ID: ${{ secrets.CLOUDWAYS_SERVER_ID }}
          APP_ID: ${{ secrets.CLOUDWAYS_APP_ID }}
        run: |
          if [ -z "$API_KEY" ]; then echo "Cloudways secrets aren't set yet, skipping."; exit 0; fi
          EMAIL=$(printf '%s' "$EMAIL" | tr -d '[:space:]'); API_KEY=$(printf '%s' "$API_KEY" | tr -d '[:space:]')
          if [ -z "$EMAIL" ]; then echo "::error::CLOUDWAYS_EMAIL is blank. Add it under Settings → Secrets and variables → Actions → Secrets (not Variables)."; exit 1; fi
          AUTH=$(curl -s -X POST https://api.cloudways.com/api/v1/oauth/access_token \
            --data-urlencode "email=$EMAIL" --data-urlencode "api_key=$API_KEY")
          TOKEN=$(echo "$AUTH" | jq -r '.access_token // empty' 2>/dev/null)
          if [ -z "$TOKEN" ]; then echo "::error::Cloudways sign-in failed. Check CLOUDWAYS_EMAIL (${#EMAIL} characters, domain ${EMAIL#*@}) and CLOUDWAYS_API_KEY (${#API_KEY} characters). Cloudways said: $(echo "$AUTH" | head -c 300)"; exit 1; fi
          PULL=$(curl -s -w ' [HTTP %{http_code}]' -X POST https://api.cloudways.com/api/v1/git/pull \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode "server_id=$SERVER_ID" \
            --data-urlencode "app_id=$APP_ID" \
            --data-urlencode "git_url=git@github.com:${{ github.repository }}.git" \
            --data-urlencode "branch_name=main" \
            --data-urlencode "deploy_path=public_html")
          echo "$PULL"
          case "$PULL" in
            *"[HTTP 2"*) echo "::notice::Cloudways is pulling the latest code." ;;
            *) echo "::error::Cloudways didn't accept the update. Check the server and app IDs, and that Deployment via Git is set up for this app. Cloudways said: $(echo "$PULL" | head -c 300)"; exit 1 ;;
          esac
